<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{ margin:0; background:var(--surface-1); padding:28px; }
  .wrap{ display:grid; gap:20px; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .statrow{ display:flex; gap:40px; padding:24px; background:var(--canvas); border-radius:var(--radius-lg); box-shadow:var(--ring-hairline); }
  h3{ font:var(--text-title-md); color:var(--ink); margin:.4rem 0 .3rem; font-family:var(--font-sans); }
  p{ font:var(--text-body-sm); color:var(--body); margin:0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, Stat, SignatureCard, Eyebrow, Button, Badge } = window.WebstrailDesignSystem_74bd7c;
  function Demo(){
    return (
      <div className="wrap">
        <div className="two">
          <Card interactive accent>
            <Eyebrow>Case study</Eyebrow>
            <h3>Tooth Teller</h3>
            <p>Built and ran the core dental platform on a two-year retainer.</p>
            <div style={{marginTop:14}}><Badge tone="neutral" outline>Build complete</Badge></div>
          </Card>
          <Card surface="sand">
            <Eyebrow tone="azure">What you get</Eyebrow>
            <h3>A product team, not a project</h3>
            <p>We design, build, and stay to run the software — accountable long after launch.</p>
          </Card>
        </div>
        <div className="statrow">
          <Stat value="2" unit="yrs" label="Running Tooth Teller" />
          <Stat value="4" label="Dental products shipped" accent />
          <Stat value="100" unit="%" label="Clients kept on retainer" />
          <Stat value="~20" label="Engineers on the bench" />
        </div>
        <SignatureCard
          variant="ink"
          eyebrow="Here for the build, and everything after"
          title="We don't ship code and walk away. We stay to run it."
          footer={<Button variant="secondary" onDark>Book a discovery call</Button>}
        >
          Product and engineering, for dentistry and nothing else.
        </SignatureCard>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
