<!-- @dsCard group="Colors" viewport="700x250" name="Brand — cool side" subtitle="Sky, azure & navy — the blue run of the logo mark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:22px;font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sw{border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--ring-hairline)}
  .chip{height:72px}
  .meta{padding:8px 10px}
  .name{font:var(--text-caption);color:var(--ink)}
  .hex{font:var(--text-mono-sm);color:var(--muted);text-transform:uppercase}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--sky)"></div><div class="meta"><div class="name">Sky</div><div class="hex">#34BFF0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--sky-deep)"></div><div class="meta"><div class="name">Sky deep</div><div class="hex">#1AA3D8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--sky-soft)"></div><div class="meta"><div class="name">Sky soft</div><div class="hex">#DCF1FB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--azure)"></div><div class="meta"><div class="name">Azure</div><div class="hex">#1280D4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--azure-deep)"></div><div class="meta"><div class="name">Azure deep</div><div class="hex">#0E5FA8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy)"></div><div class="meta"><div class="name">Navy</div><div class="hex">#0F5090</div></div></div>
  </div>
</body></html>
