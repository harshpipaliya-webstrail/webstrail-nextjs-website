<!-- @dsCard group="Brand" viewport="700x210" name="Signature surfaces" subtitle="Solid color blocks — one per logo color — the brand's voltage" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:22px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .s{height:84px;border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--ring-hairline)}
  .eb{font:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;opacity:.8}
  .tag{font:var(--text-caption);font-family:var(--font-mono);opacity:.92}
</style></head>
<body>
  <div class="grid">
    <div class="s" style="background:var(--sig-coral-bg);color:var(--sig-coral-fg)"><span class="eb">Orange</span><span class="tag">--sig-coral-bg · #F0611F</span></div>
    <div class="s" style="background:var(--sig-amber-bg);color:var(--sig-amber-fg)"><span class="eb">Amber</span><span class="tag">--sig-amber-bg · #E0A82E</span></div>
    <div class="s" style="background:var(--sig-sky-bg);color:var(--sig-sky-fg)"><span class="eb">Sky</span><span class="tag">--sig-sky-bg · #34BFF0</span></div>
    <div class="s" style="background:var(--sig-azure-bg);color:var(--sig-azure-fg)"><span class="eb">Azure</span><span class="tag">--sig-azure-bg · #1280D4</span></div>
    <div class="s" style="background:var(--sig-navy-bg);color:var(--sig-navy-fg)"><span class="eb">Navy</span><span class="tag">--sig-navy-bg · #0F5090</span></div>
    <div class="s" style="background:var(--sig-ink-bg);color:var(--sig-ink-fg)"><span class="eb">Ink</span><span class="tag">--sig-ink-bg · #16161A</span></div>
  </div>
</body></html>
