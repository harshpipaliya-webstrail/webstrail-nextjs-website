<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="4px base grid; 96px section rhythm" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .tok{font:var(--text-mono-sm);color:var(--muted);width:96px;flex:0 0 96px}
  .bar{height:16px;background:var(--coral);border-radius:var(--radius-xs)}
  .px{font:var(--text-caption);color:var(--ink)}
</style></head>
<body>
  <div class="row"><span class="tok">space-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>
  <div class="row"><span class="tok">space-2</span><div class="bar" style="width:8px"></div><span class="px">8</span></div>
  <div class="row"><span class="tok">space-3</span><div class="bar" style="width:12px"></div><span class="px">12</span></div>
  <div class="row"><span class="tok">space-4</span><div class="bar" style="width:16px"></div><span class="px">16</span></div>
  <div class="row"><span class="tok">space-5</span><div class="bar" style="width:24px"></div><span class="px">24</span></div>
  <div class="row"><span class="tok">space-6</span><div class="bar" style="width:32px"></div><span class="px">32</span></div>
  <div class="row"><span class="tok">space-7</span><div class="bar" style="width:48px"></div><span class="px">48</span></div>
  <div class="row"><span class="tok">space-8</span><div class="bar" style="width:64px"></div><span class="px">64</span></div>
  <div class="row"><span class="tok">space-9</span><div class="bar" style="width:96px"></div><span class="px">96 · section</span></div>
</body></html>
