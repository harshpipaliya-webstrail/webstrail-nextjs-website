<!-- @dsCard group="Spacing" viewport="700x180" name="Radii" subtitle="Soft, approachable corners; pill for buttons" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;gap:8px;align-items:center}
  .box{width:78px;height:60px;background:var(--surface-2);box-shadow:var(--ring-hairline)}
  .name{font:var(--text-caption);color:var(--ink)}
  .v{font:var(--text-mono-sm);color:var(--muted)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="name">xs</div><div class="v">4</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="v">8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md</div><div class="v">12</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg</div><div class="v">16</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl</div><div class="v">24</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="name">2xl</div><div class="v">32</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:110px"></div><div class="name">pill</div><div class="v">9999</div></div>
  </div>
</body></html>
