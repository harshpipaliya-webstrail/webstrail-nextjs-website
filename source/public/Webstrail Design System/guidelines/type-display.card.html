<!-- @dsCard group="Type" viewport="700x300" name="Display — Inter Tight" subtitle="Tight grotesque for headlines; emphasis from size, not weight" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:26px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:baseline;gap:16px}
  .tok{font:var(--text-mono-sm);color:var(--muted);min-width:120px;flex:0 0 120px}
  .d2xl{font:var(--text-display-2xl);color:var(--ink)}
  .dxl{font:var(--text-display-xl);color:var(--ink)}
  .dlg{font:var(--text-display-lg);color:var(--ink)}
  .dmd{font:var(--text-display-md);color:var(--ink)}
  .dsm{font:var(--text-display-sm);color:var(--ink)}
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="tok">display-2xl · 600</span><span class="d2xl">All we build is dental</span></div>
    <div class="line"><span class="tok">display-xl · 500</span><span class="dxl">Here for the build</span></div>
    <div class="line"><span class="tok">display-lg · 500</span><span class="dlg">Built right, and looked after</span></div>
    <div class="line"><span class="tok">display-md · 500</span><span class="dmd">The product team for dental companies</span></div>
    <div class="line"><span class="tok">display-sm · 500</span><span class="dsm">Design, build, and run</span></div>
  </div>
</body></html>
