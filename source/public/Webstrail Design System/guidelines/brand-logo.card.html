<!-- @dsCard group="Brand" viewport="700x230" name="Logo" subtitle="Primary lockup on light surfaces; keep generous clearspace" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:24px;font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;padding:34px;min-height:120px;box-shadow:var(--ring-hairline)}
  .light{background:var(--canvas)}
  .sand{background:var(--surface-2)}
  img{width:230px;height:auto}
  .note{grid-column:1/-1;font:var(--text-caption);color:var(--muted);margin-top:4px}
</style></head>
<body>
  <div class="row">
    <div class="panel light"><img src="../assets/webstrail-logo.png" alt="Webstrail"/></div>
    <div class="panel sand"><img src="../assets/webstrail-logo.png" alt="Webstrail"/></div>
    <p class="note">Clearspace ≥ the height of the mark on all sides. The wordmark is near-black; for dark or signature-color surfaces, request a reversed (white) wordmark — the current art has no light variant.</p>
  </div>
</body></html>
