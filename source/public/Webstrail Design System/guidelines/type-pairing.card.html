<!-- @dsCard group="Type" viewport="700x240" name="Pairing in use" subtitle="Eyebrow + serif headline + grotesque lede — the standard section opener" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--surface-1);padding:34px}
  .eb{font:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--coral-deep);display:flex;align-items:center;gap:.6em}
  .eb::before{content:"";width:1.8em;height:1px;background:currentColor;opacity:.6}
  h2{font:var(--text-display-lg);color:var(--ink);letter-spacing:var(--track-display);margin:14px 0 12px;max-width:20ch}
  .lede{font:var(--text-body-lg);color:var(--body);max-width:54ch}
  .grad{color:var(--coral)}
</style></head>
<body>
  <span class="eb">Build and run</span>
  <h2>We build the software dental companies <span class="grad">grow on</span>.</h2>
  <p class="lede">Design, build, and run — one accountable partner for the life of the product. Off-the-shelf software won't fit your model. We build what does, then we stay to operate it.</p>
</body></html>
