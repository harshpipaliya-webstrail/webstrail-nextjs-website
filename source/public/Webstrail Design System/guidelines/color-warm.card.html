<!-- @dsCard group="Colors" viewport="700x250" name="Brand — warm side" subtitle="Orange & amber, sampled straight from the logo mark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:22px;font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sw{border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--ring-hairline)}
  .chip{height:72px}
  .meta{padding:8px 10px}
  .name{font:var(--text-caption);color:var(--ink)}
  .hex{font:var(--text-mono-sm);color:var(--muted);text-transform:uppercase}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--coral)"></div><div class="meta"><div class="name">Orange</div><div class="hex">#F0611F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-deep)"></div><div class="meta"><div class="name">Orange deep</div><div class="hex">#DC4A18</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-soft)"></div><div class="meta"><div class="name">Orange soft</div><div class="hex">#FCE6DB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber)"></div><div class="meta"><div class="name">Amber</div><div class="hex">#E0A82E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-deep)"></div><div class="meta"><div class="name">Amber deep</div><div class="hex">#BE851A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-soft)"></div><div class="meta"><div class="name">Amber soft</div><div class="hex">#FBEFD3</div></div></div>
  </div>
</body></html>
