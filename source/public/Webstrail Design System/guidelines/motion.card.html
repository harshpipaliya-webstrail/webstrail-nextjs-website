<!-- @dsCard group="Spacing" viewport="700x150" name="Motion — easing & reveal" subtitle="Fade-and-rise on scroll; gentle ease-out; subtle spring on lift" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--canvas);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;gap:14px;align-items:stretch}
  .card{flex:1;background:var(--surface-1);border-radius:var(--radius-md);padding:14px;box-shadow:var(--ring-hairline);animation:ws-fade-rise var(--dur-slower) var(--ease-out) both}
  .card:nth-child(2){animation-delay:.12s}
  .card:nth-child(3){animation-delay:.24s}
  .card:nth-child(4){animation-delay:.36s}
  .k{font:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--coral-deep)}
  .v{font:var(--text-mono-sm);color:var(--muted);margin-top:6px}
</style></head>
<body>
  <div class="row">
    <div class="card"><div class="k">fade-rise</div><div class="v">opacity + 18px ↑</div></div>
    <div class="card"><div class="k">ease-out</div><div class="v">0.22,1,0.36,1</div></div>
    <div class="card"><div class="k">duration</div><div class="v">240 / 480 / 720ms</div></div>
    <div class="card"><div class="k">spring</div><div class="v">lift on hover</div></div>
  </div>
</body></html>
