<style>
  :root { --content-max: 1640px; --page-gutter: clamp(18px, 2.4vw, 40px);
    --radius-xs:2px;--radius-sm:3px;--radius-md:4px;--radius-lg:6px;--radius-xl:8px;--radius-2xl:10px;--radius-pill:6px;
    --font-display:"TT Hoves Pro","General Sans","DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-sans:"TT Hoves Pro","General Sans","DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --track-display:-0.028em; }
  .nav__brand img { height: 42px; }

  /* Related Blogs: show a skeleton until the same-category list is ready (script adds .rb-ready).
     The original list stays in the DOM; it is only masked. Safety net: revealed after 8s. */
  @keyframes rb-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  @keyframes rb-reveal { to { max-height: 4000px; } }
  #related-blogs:not(.rb-ready) .blog-list { position: relative; max-height: 190px; overflow: hidden; animation: rb-reveal 0s 8s forwards; }
  #related-blogs:not(.rb-ready) .blog-list > div { visibility: hidden; }
  #related-blogs:not(.rb-ready) .blog-list::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(#e2e8f0,#e2e8f0) 0 4px / 100% 14px no-repeat,
      linear-gradient(#e2e8f0,#e2e8f0) 0 42px / 80% 14px no-repeat,
      linear-gradient(#e2e8f0,#e2e8f0) 0 80px / 100% 14px no-repeat,
      linear-gradient(#e2e8f0,#e2e8f0) 0 118px / 70% 14px no-repeat,
      linear-gradient(#e2e8f0,#e2e8f0) 0 156px / 90% 14px no-repeat;
    animation: rb-pulse 1.5s infinite;
  }
</style>
