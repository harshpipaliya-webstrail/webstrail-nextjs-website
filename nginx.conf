# Webstrail — static site nginx config. Point `root` at the contents of ./site/
# Serves clean directory URLs (/services/foo/) and the .html redirect stubs.
server {
  listen 80;
  listen [::]:80;
  server_name webstrail.com www.webstrail.com;

  # --- redirect www -> apex and http -> https (enable once TLS is set up) ---
  # if ($host = www.webstrail.com) { return 301 https://webstrail.com$request_uri; }
  # return 301 https://webstrail.com$request_uri;

  root /var/www/webstrail;        # <-- put the contents of ./site/ here
  index index.html;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Clean URLs: real file -> directory index -> .html -> 404
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Blogs: /blog/<slug>/. Static blogs and the sheet blogs known at build time are real files
  # (served by try_files). A blog added to the Google Sheet after the last build has no file, so
  # it is served the placeholder page /blog/_/, which loads the right blog in the browser from
  # the URL. No rebuild is needed for new sheet blogs to be reachable.
  location ~ ^/blog/[^/]+/?$ {
    try_files $uri $uri/ /blog/_/index.html;
  }

  # Case studies: same idea. Static case studies and the API case studies known at build time are
  # real files; one added after the last build is served the placeholder /case-studies/_/.
  location ~ ^/case-studies/[^/]+/?$ {
    try_files $uri $uri/ /case-studies/_/index.html;
  }

  # Old dynamic-blog URLs (/blogs, /blogs/<slug>) now live under /blog
  location ~ ^/blogs(/.*)?$ {
    return 301 /blog$1;
  }

  # Blog + case-study data scripts (static lists, merge logic, index/detail): they change whenever blogs
  # are added/edited and are NOT content-hashed, so the browser must revalidate every time.
  # (Must stay above the generic .js caching rule below.)
  location ~* ^/(api-config|blogs-static|blogs-data|blog-index|blog-detail|related-blogs-merged|case-studies-static|case-studies-data|case-studies-index|case-studies-related|case-study-detail)\.js$ {
    add_header Cache-Control "no-cache";
  }

  # Immutable, content-hashed Next.js assets — cache hard
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Other static assets — cache a month (URLs are version-busted with ?v=)
  location ~* \.(css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  error_page 404 /404.html;

  # OPTIONAL: replace the meta-refresh redirect stubs with real 301s (better for SEO).
  # If you enable these, you may delete the matching *.html stub files from the root.
  #   location = /case-studies.html                 { return 301 /case-studies/; }
  #   location = /privacy-policy.html                { return 301 /privacy-policy/; }
  #   location = /terms-of-service.html              { return 301 /terms-of-service/; }
  #   location = /trust-service-center.html          { return 301 /trust-service-center/; }
  #   # case-studies/<slug>.html -> /case-studies/<slug>/  and case-study-NN.html stubs
}

