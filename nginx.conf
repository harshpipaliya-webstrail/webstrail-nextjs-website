# Webstrail — static site nginx config. Point `root` at the contents of ./site/
# Serves clean directory URLs (/services/foo/) and the .html redirect stubs.
server {
  listen 80;
  listen [::]:80;
  server_name webstrail.com www.webstrail.com;

  # --- redirect www -> apex and http -> https (enable once TLS is set up) ---
  # if ($host = www.webstrail.com) { return 301 https://webstrail.com$request_uri; }
  # return 301 https://webstrail.com$request_uri;

  root /var/www/webstrail;        # <-- put the contents of ./site/ here
  index index.html;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Clean URLs: real file -> directory index -> .html -> 404
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Immutable, content-hashed Next.js assets — cache hard
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Other static assets — cache a month (URLs are version-busted with ?v=)
  location ~* \.(css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  error_page 404 /404.html;

  # OPTIONAL: replace the meta-refresh redirect stubs with real 301s (better for SEO).
  # If you enable these, you may delete the matching *.html stub files from the root.
  #   location = /case-studies.html                 { return 301 /case-studies/; }
  #   location = /privacy-policy.html                { return 301 /privacy-policy/; }
  #   location = /terms-of-service.html              { return 301 /terms-of-service/; }
  #   location = /trust-service-center.html          { return 301 /trust-service-center/; }
  #   # case-studies/<slug>.html -> /case-studies/<slug>/  and case-study-NN.html stubs
}

